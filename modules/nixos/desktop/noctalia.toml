[bar.default]
center = ["workspaces"]
concave_edge_corners = false
end = [
  "tray",
  "notifications",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "session",
]
shadow = false
start = ["group:g2", "group:g1"]

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_variant"
id = "g1"
members = ["cpu", "temp", "ram", "sysmon"]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_variant"
id = "g2"
members = ["clock", "date"]
opacity = 1.0
padding = 6.0

[config]

[lockscreen_widgets]
schema_version = 2
widget_order = ["lockscreen-login-box@eDP-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 196.0
box_width = 810.0
cx = 960.0
cy = 898.0
output = "eDP-1"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_password_reveal = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[shell]
avatar_path = "/home/baris/.face"
clipboard_enabled = false
clipboard_keep_from_closed_apps = false

[shell.panel]
open_near_click_clipboard = true

[templates]

[theme]
source = "wallpaper"

[wallpaper.default]
path = "/home/baris/Pictures/Wallpapers/hololive.jpg"

[wallpaper.last]
path = "/home/baris/Pictures/Wallpapers/hololive.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/baris/Pictures/Wallpapers/hololive.jpg"

[widget.sysmon]
stat = "disk_used"

[widget.tray]
drawer = true
